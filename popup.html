<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
        }
        .header {
            background: #11458A;
            color: white;
            margin: -20px -20px 20px -20px;
            padding: 16px 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: white;
        }
        .header .subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            margin-top: 4px;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .rating-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .rating-option {
            padding: 10px 6px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 500;
        }
        .rating-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(17, 69, 138, 0.15);
            border-color: #11458A;
        }
        .rating-option.selected {
            border-color: #11458A;
            background: #e8edf6;
            box-shadow: 0 0 0 3px rgba(17, 69, 138, 0.2);
        }
        .rating-option .emoji {
            display: block;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .rating-option .label {
            display: block;
            font-size: 11px;
            color: #333;
        }
        .rating-option.selected .label {
            color: #11458A;
            font-weight: 600;
        }
        .btn-batch {
            width: 100%;
            padding: 12px;
            background: #11458A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-batch:hover {
            background: #0d356b;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(17, 69, 138, 0.4);
        }
        .btn-batch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        #status.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #status.info {
            display: block;
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
        .sheet-count {
            text-align: center;
            color: #11458A;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: 500;
            background: #e8edf6;
            padding: 8px;
            border-radius: 6px;
        }
        .loader {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
        .loader.active {
            display: block;
        }
        .loader .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e8edf6;
            border-top: 3px solid #11458A;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            padding-top: 12px;
        }
        .footer span {
            color: #11458A;
            font-weight: 600;
        }
        /* Color coding for each rating */
        .rating-option[data-rating="very bad"] .emoji { color: #dc3545; }
        .rating-option[data-rating="bad"] .emoji { color: #fd7e14; }
        .rating-option[data-rating="average"] .emoji { color: #ffc107; }
        .rating-option[data-rating="good"] .emoji { color: #20c997; }
        .rating-option[data-rating="very good"] .emoji { color: #17a2b8; }
        .rating-option[data-rating="excellent"] .emoji { color: #007bff; }
    </style>
</head>
<body>
    <div class="header">
        <h2>UGV Lecture Sheet Rater</h2>
        <div class="subtitle">Rate all lecture sheets at once</div>
    </div>
    
    <div class="sheet-count" id="sheetCount">Loading sheets...</div>
    
    <div class="rating-grid">
        <div class="rating-option" data-rating="very bad">
            <span class="emoji">🤮</span>
            <span class="label">Very Bad</span>
        </div>
        <div class="rating-option" data-rating="bad">
            <span class="emoji">🤢</span>
            <span class="label">Bad</span>
        </div>
        <div class="rating-option" data-rating="average">
            <span class="emoji">😐</span>
            <span class="label">Average</span>
        </div>
        <div class="rating-option" data-rating="good">
            <span class="emoji">🙂</span>
            <span class="label">Good</span>
        </div>
        <div class="rating-option" data-rating="very good">
            <span class="emoji">🫡</span>
            <span class="label">Very Good</span>
        </div>
        <div class="rating-option" data-rating="excellent">
            <span class="emoji">👏😱</span>
            <span class="label">Excellent</span>
        </div>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <span style="display:block;margin-top:8px;color:#11458A;font-size:13px;">Processing...</span>
    </div>

    <button class="btn-batch" id="batchBtn" disabled>Select a rating first</button>
    
    <div id="status"></div>
    
    <div class="footer">
        <span>Built by Rudro Debnath</span><br>
        Department of CSE<br>
        University of Global Village
    </div>

    <script src="popup.js"></script>
</body>
</html>
